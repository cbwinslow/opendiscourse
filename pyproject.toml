[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendiscourse-research"
version = "0.1.0"
description = "A provenance-first U.S. public policy, economic, and financial research database."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6,<7",
  "tenacity>=8.3,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
analytics = ["polars>=1,<2", "pyarrow>=16,<20"]
spatial = ["geopandas>=1,<2", "pyogrio>=0.9,<1", "shapely>=2,<3"]
fred = ["fredapi>=0.5,<1"]
ingest = ["dlt[postgres]>=1.29,<2", "openpyxl>=3.1,<4"]
browser = ["textual>=0.85,<1"]

[project.scripts]
research-db = "opendiscourse_research.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
