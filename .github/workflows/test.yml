name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: opendiscourse_census_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opendiscourse_census_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENDISCOURSE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opendiscourse_census_test
      OPENDISCOURSE_DATA_ROOT: ${{ github.workspace }}/.test-data/raw
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --extra ingest --extra spatial
      - name: Verify reviewed Alembic baseline DDL
        run: uv run python scripts/render_baseline_ddl.py --check
      - name: Run deterministic and isolated database tests
        run: uv run --locked --extra ingest --extra spatial pytest
