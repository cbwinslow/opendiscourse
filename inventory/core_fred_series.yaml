# RUT (Russell 2000), GOLDAMGBD228NLBM (LBMA gold fixing), and USD1MTD156N
# (USD 1-month LIBOR) were removed 2026-08-06 after FRED confirmed all three
# no longer exist ("Bad Request. The series does not exist.", verified via a
# direct API call outside any batch/pacing context, not a rate-limit
# artifact). FRED periodically retires series when upstream benchmarks are
# discontinued or replaced; LIBOR and the LBMA gold-fixing benchmark were
# both wound down some years ago. A replacement gold-price and small-cap
# equity series would be a reasonable future addition once picked
# deliberately, not restored under their old (dead) IDs.
series:
