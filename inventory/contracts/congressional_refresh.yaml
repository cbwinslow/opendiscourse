version: 1
description: >-
  Reviewed, disabled-by-default incremental congressional refresh contracts.
  Enabling any contract requires credential, pacing, source-manifest, and
  validation approval in the same change.
contracts:
  - id: openstatesvotes
    provider: openstates
    dataset: openstates.legislation
    kind: snapshot_incremental
    target: core.roll_call
    cadence: daily
    enabled: true
    approval: approved_snapshot_acquisition
    selection:
      jurisdiction: ocd-jurisdiction/country:us/government
      congresses: [118, 119]
      entities: [voteevent, personvote]
    cursor:
      strategy: ocd_vote_event_keyset
      key: ocd_id
      page_size: 25
    provenance:
      source: openstates_source
      artifact_required: true
    snapshot:
      endpoint_template: https://data.openstates.org/postgres/monthly/{YYYY-MM}-public.pgdump
      retention: preserve_previous_until_post_load_reconciliation
      fdw_schema: openstates_source
    storage:
      reserve_gib: 100
    validation:
      dry_run_required: true
      reconcile_command: reconcile-openstates-votes
      idempotency_required: true
      partial_congresses: [119]
    notes: >-
      User approved snapshot acquisition on 2026-08-04 after the read-only
      dry run, storage check, manifest validator, resume drill, and exception
      reporting were verified. Acquire only the latest completed monthly export;
      snapshot restore, FDW remapping, canonical loading, and promotion remain
      separately gated.
  - id: congresspeople
    provider: congress
    dataset: congress.legislation
    kind: api_enrichment
    target: core.person
    cadence: daily
    enabled: false
    approval: pending
    selection:
      congress: 119
      entity: members
    cursor:
      strategy: provider_updated_at
      key: updateDate
    provenance:
      source: congress.gov
      raw_payload_required: true
    validation:
      dry_run_required: true
      stable_identifier_required: true
      conflict_report_required: true
      idempotency_required: true
    notes: >-
      Enrich OpenStates baseline identities only from stable primary-source
      identifiers; never reassign a conflicting identifier automatically.
