version: 1
description: >-
  Authoritative-source inventory for the U.S. public-policy, economic, and
  financial research warehouse. Dataset IDs are stable catalog keys.
providers:
  - id: census
    name: U.S. Census Bureau
    base_url: https://api.census.gov/data
    auth: api_key
    datasets:
      - id: census.api_catalog
        title: Census Data API offering catalog
        access: Census Data API data.json catalog
        client: httpx
        grain: published Census API offering × vintage
        identifiers: [identifier, vintage, endpoint]
        cadence: provider release schedule
        priority: 1
        notes: Metadata-only index of every offering published by the Census Data API. Selecting an offering never authorizes observation or bulk-file acquisition.
      - id: census.acs_1
        title: American Community Survey 1-Year
        access: REST API and summary downloads
        client: httpx; optional census/censusdis convenience wrappers
        grain: geography × ACS variable × release vintage
        identifiers: [GEOID, variable_id, vintage]
        cadence: annual
        priority: 1
        notes: Use only for published population thresholds; retain estimate and MOE.
      - id: census.acs_5
        title: American Community Survey 5-Year
        access: REST API and summary downloads
        client: httpx; optional census/censusdis convenience wrappers
        grain: geography × ACS variable × release vintage
        identifiers: [GEOID, variable_id, vintage]
        cadence: annual
        priority: 1
        notes: Default small-area demographic and housing baseline; do not compare overlapping windows as independent observations.
      - id: census.acs_5_bulk
        title: American Community Survey 5-Year bulk downloads
        access: ACS table-based Summary File downloads
        client: httpx
        grain: release × complete Detailed Table bundle
        identifiers: [release_year, package]
        cadence: annual
        priority: 1
        notes: Primary browser path for complete ACS releases. The package contains all Detailed Tables, estimates, margins of error, and published geographies; later loads filter to approved canonical scope.
      - id: census.decennial
        title: Decennial Census
        access: REST API and bulk files
        client: httpx
        grain: geography × table variable × census year
        identifiers: [GEOID, variable_id, vintage]
        cadence: decennial
        priority: 2
      - id: census.population_estimates
        title: Population Estimates Program
        access: REST API and downloads
        client: httpx
        grain: geography × estimate date × vintage
        identifiers: [GEOID, date, vintage]
        cadence: annual
        priority: 1
      - id: census.tiger
        title: TIGER/Line and cartographic boundary files
        access: bulk ZIP shapefiles
        client: geopandas + pyogrio + shapely
        grain: geography boundary × boundary vintage
        identifiers: [GEOID, geography_type, boundary_vintage]
        cadence: annual
        priority: 1
        notes: Includes state, county, tract, block group, ZCTA, congressional, state legislative, and voting district geographies where available.
      - id: census.business_patterns
        title: County Business Patterns and Nonemployer Statistics
        access: REST API and bulk files
        client: httpx
        grain: geography × NAICS × year
        identifiers: [GEOID, NAICS, year]
        cadence: annual
        priority: 2
      - id: census.government_finance
        title: Census Government Finance
        access: API and bulk files
        client: httpx
        grain: government unit × finance category × fiscal year
        identifiers: [government_id, FIPS, fiscal_year]
        cadence: annual
        priority: 2
  - id: fred
    name: Federal Reserve Bank of St. Louis — FRED and ALFRED
    base_url: https://api.stlouisfed.org
    auth: api_key
    datasets:
      - id: fred.series
        title: FRED/ALFRED macroeconomic series
        access: FRED API v1/v2
        client: httpx; optional fredapi
        grain: series × observation date × real-time vintage
        identifiers: [series_id, observation_date, realtime_start, realtime_end]
        cadence: provider release schedule
        priority: 1
        notes: Retain vintages for revision-aware research and preserve third-party attribution.
  - id: bea
    name: Bureau of Economic Analysis
    base_url: https://apps.bea.gov/api
    auth: api_key
    datasets:
      - id: bea.regional
        title: Regional GDP, personal income, and price parities
        access: REST API and bulk files
        client: httpx
        grain: table × line code × GeoFIPS × period
        identifiers: [TableName, LineCode, GeoFips, period]
        cadence: quarterly_or_annual
        priority: 1
  - id: bls
    name: Bureau of Labor Statistics
    base_url: https://api.bls.gov/publicAPI/v2
    auth: optional_registration
    datasets:
      - id: bls.laus
        title: Local Area Unemployment Statistics
        access: API plus series metadata downloads
        client: httpx
        grain: BLS series × period
        identifiers: [series_id, period]
        cadence: monthly
        priority: 1
      - id: bls.qcew
        title: Quarterly Census of Employment and Wages
        access: bulk CSV and API
        client: httpx; polars for bulk files
        grain: area × industry × ownership × quarter
        identifiers: [area_fips, industry_code, own_code, quarter]
        cadence: quarterly
        priority: 2
      - id: bls.cpi
        title: Consumer Price Index
        access: API plus series metadata downloads
        client: httpx
        grain: series × month
        identifiers: [series_id, period]
        cadence: monthly
        priority: 1
  - id: treasury
    name: U.S. Treasury / USAspending
    auth: varies_by_endpoint
    datasets:
      - id: treasury.fiscal_data
        title: Fiscal Data API
        access: REST API and CSV
        client: httpx
        grain: dataset-specific record
        identifiers: [record_date, dataset_specific_id]
        cadence: daily_or_monthly
        priority: 2
      - id: treasury.yield_curve
        title: Daily Treasury par nominal, real, and bill yield curves
        access: Treasury daily-rate historical pages and CSV/XML feeds
        client: httpx; built-in HTML parser
        grain: curve type × observation date × tenor
        identifiers: [curve_type, observation_date, tenor]
        cadence: business_daily
        priority: 1
        notes: Preserve every published tenor and curve methodology/source metadata.
      - id: usaspending.awards
        title: Federal awards and assistance
        access: REST API and bulk downloads
        client: httpx; polars for bulk files
        grain: award transaction
        identifiers: [award_id, transaction_id, recipient_uei]
        cadence: daily
        priority: 2
  - id: fbi
    name: FBI Crime Data Explorer
    auth: api_key_or_bulk
    datasets:
      - id: fbi.crime_agency
        title: Crime agencies and reported offense statistics
        access: CDE API and annual bulk NIBRS/UCR extracts
        client: httpx; polars for bulk files
        grain: agency/ORI × offense × period
        identifiers: [ori, offense_code, period]
        cadence: annual_with_incremental_updates
        priority: 2
        notes: Store reporting coverage; ORI-to-county is a non-authoritative crosswalk.
  - id: congress
    name: Congress.gov and GovInfo
    auth: api_data_gov_key
    datasets:
      - id: congress.legislation
        title: Federal members, bills, actions, amendments, committees, and House votes
        access: Congress.gov REST API
        client: httpx
        grain: entity/version or roll call/member position
        identifiers: [bioguide_id, congress, bill_type, bill_number, roll_call]
        cadence: daily_when_in_session
        priority: 1
      - id: congress.legislators
        title: Federal legislators since 1789 and their external identifiers (BioGuide crosswalk)
        access: unitedstates/congress-legislators YAML checkout under vendor/
        client: pyyaml; git checkout via scripts/bootstrap_upstream.sh
        grain: legislator × external identifier
        identifiers: [bioguide, fec, govtrack, opensecrets, icpsr, wikidata]
        cadence: on_upstream_change
        priority: 1
        notes: Public-domain CC0 upstream. Person joins use BioGuide only, never names.
      - id: congress.govinfo_billstatus
        title: GovInfo bulk bill status
        access: GovInfo bulk XML/JSON directory manifests
        client: httpx; xml.etree for XML parsing
        grain: Congress × bill
        identifiers: [congress, bill_type, bill_number]
        cadence: daily
        priority: 1
        notes: Status only. Bill text is congress.govinfo_bills (Story 11.3).
      - id: congress.govinfo_bills
        title: GovInfo bulk bill text (BILLS XML versions)
        access: >-
          GovInfo BILLS bulk zips (one per Congress × session × bill type) listed at
          https://www.govinfo.gov/bulkdata/json/BILLS/{congress}/{session}/{type};
          individual XML is the fallback when a zip is unpublished
        client: httpx; xml.etree for XML parsing
        grain: Congress × session × bill type × bill number × version
        identifiers: [congress, session, bill_type, bill_number, version_code]
        cadence: daily
        priority: 1
        notes: >-
          Public domain. Bulk starts at the 113th Congress. Join to core.bill by congress, type and
          number only; never create a bill from the text file. Sponsor name-id values stay in the
          record. Do not fetch bill.dtd or billres.xsl. PLAW, BILLSUM, PDF and HTM are out of scope.
      - id: congress.house_votes
        title: House roll-call votes from the Clerk's official XML (one file per roll call, 108th Congress on)
        access: clerk.house.gov/evs/<year>/roll<NNN>.xml, listed by the yearly index (index.asp and ROLL_*.asp)
        client: httpx; xml.etree for parsing
        grain: roll call × member position
        identifiers: [congress, roll_year, roll_number, bioguide_id]
        cadence: daily_when_in_session
        priority: 1
        notes: >-
          Public domain. Members join on the BioGuide name-id the file states, never on the printed name.
          Enriches the OpenStates-derived roll calls in place (matched by year and roll number).
      - id: congress.senate_votes
        title: Senate roll-call votes from senate.gov's official XML (one file per roll call, 108th Congress on)
        access: >-
          senate.gov/legislative/LIS/roll_call_votes/vote<C><S>/vote_<C>_<S>_<NNNNN>.xml, listed by the session menu
          senate.gov/legislative/LIS/roll_call_lists/vote_menu_<C>_<S>.xml
        client: httpx; xml.etree for parsing
        grain: roll call × senator position
        identifiers: [congress, session, roll_year, roll_number, lis_member_id]
        cadence: daily_when_in_session
        priority: 1
        notes: >-
          Public domain. Senators join on the LIS member id the file states (core.person_identifier namespace lis),
          never on the printed name. Enriches the OpenStates-derived roll calls in place (matched by year and roll
          number). The Vice President's tie-break is on the roll call, not a member vote.
      - id: congress.committee_membership
        title: Current committee and subcommittee assignments (BioGuide)
        access: >-
          unitedstates/congress-legislators YAML at a pinned commit:
          committees-current.yaml, committees-historical.yaml, committee-membership-current.yaml
        client: httpx; pyyaml
        grain: committee (membership-file key) × current member
        identifiers: [thomas_key, bioguide]
        cadence: on_upstream_change
        priority: 1
        notes: >-
          Public-domain CC0. `research-db sync-committee-membership` downloads the three
          files into DATA_ROOT. A subcommittee key is the parent thomas id plus the short
          code, because short codes such as 01 repeat. Join members on BioGuide only.
          Current assignments only; the historical file has committees but no membership.
          Do not scrape Clerk HTML.
      - id: congress.congress_gov_bills
        title: Congress.gov bills before GovInfo bulk files (93rd-107th Congress)
        access: https://api.congress.gov/v3/bill/{congress}
        client: httpx
        grain: bill
        identifiers: [congress, bill_type, bill_number, bioguide]
        cadence: backfill
        priority: 1
        notes: >-
          GovInfo BILLSTATUS starts at the 108th Congress. `research-db
          sync-congress-bills` downloads the official Congress.gov JSON for
          earlier Congresses, default 106 and 107 (2000-2002), and saves it
          into the same bill tables. It refuses Congress 108 and later.
          Requires CONGRESS_API_KEY.
      - id: congress.voteview
        title: Voteview member ideology (DW-NOMINATE) and roll-call index
        access: >-
          https://voteview.com/static/data/out/members/HSall_members.csv,
          https://voteview.com/static/data/out/rollcalls/HSall_rollcalls.json,
          https://voteview.com/static/data/out/parties/HSall_parties.csv
        client: httpx
        grain: member × congress (ideology); roll call (index); party × congress
        identifiers: [icpsr, congress, chamber, rollnumber]
        cadence: as_votes_occur
        priority: 2
        notes: >-
          Cite Lewis, Poole, Rosenthal, Boche, Rudkin, and Sonnet, Voteview:
          Congressional Roll-Call Votes Database, https://voteview.com/.
          `research-db sync-voteview` keeps those three files and joins people on
          ICPSR already in core.person_identifier. It does not download
          HSall_votes.csv and does not replace Clerk or Senate.gov votes. NOMINATE
          stays Voteview's measurement.
      - id: congress.cbo_cost_estimates
        title: CBO cost estimates already carried in BILLSTATUS records
        access: retained GovInfo BILLSTATUS XML (cboCostEstimates) -> core.bill_cbo_cost_estimate; CBO.gov pages for PDFs
        client: existing BILLSTATUS Connector; optional later PDF fetch
        grain: bill × estimate
        identifiers: [congress, bill_type, bill_number, pubDate, url]
        cadence: with_billstatus
        priority: 1
        notes: Typed from existing BILLSTATUS evidence; no CBO XML index or PDF is fetched. CBO XML index returned HTTP 403 to scripted fetch (2026-09-22).
      - id: govinfo.bulk
        title: Bill status/text, Congressional Record, statutes, CFR, and Federal Register
        access: GovInfo API and bulk XML/JSON
        client: httpx; lxml for XML parsing
        grain: package/granule/version
        identifiers: [package_id, granule_id, congress]
        cadence: daily_or_collection_release
        priority: 1
  - id: openstates
    name: Plural Open / OpenStates
    base_url: https://v3.openstates.org
    auth: api_key
    datasets:
      - id: openstates.legislation
        title: State legislators, bills, actions, sponsorships, votes, committees, and events
        access: REST API v3
        client: httpx
        grain: Open Civic Data entity/version
        identifiers: [ocd_person_id, ocd_bill_id, jurisdiction, session]
        cadence: daily_during_sessions
        priority: 1
        notes: Availability and completeness vary by jurisdiction.
      - id: openstates.dump
        title: OpenStates database/source export
        access: Official monthly public pg_dump and matching schema archive
        client: pg_restore/psql only after inspection; otherwise provider parser
        grain: source-export snapshot
        identifiers: [snapshot_id, checksum]
        cadence: provider_defined
        priority: 2
        notes: Public pattern is data.openstates.org/postgres/{monthly,schema}/YYYY-MM-*.pgdump. Do not restore into the research database; stage and inspect it first.
  - id: elections
    name: Federal Election Commission and election-source partners
    auth: api_key_varies
    datasets:
      - id: fec.campaign_finance
        title: FEC committees, candidates, filings, receipts, and disbursements
        access: FEC REST API and bulk files
        client: httpx; polars for bulk files
        grain: filing or transaction
        identifiers: [candidate_id, committee_id, filing_id, transaction_id]
        cadence: daily_and_filing_schedule
        priority: 2
        person_join:
          state: blocked
          key: bioguide
          via: fec
          blocked_by: [reviewed_join_contract, fec_candidate_committee_linkage_files]
          notes: >-
            Identity prerequisite met by Story 3.1: core.person_identifier holds
            FEC candidate ids (namespace fec) for the people in
            congress-legislators. Still blocked: no reviewed contract says how
            candidate-keyed rows join, and committee-only rows need the FEC
            cn/cm/ccl linkage files, which are not on disk. Never join on
            candidate or committee names.
      - id: disclosures.financial
        title: Congressional financial disclosures and periodic transaction reports
        access: Official House and Senate disclosure portals, where bulk export is offered
        client: httpx; PDF/CSV parser selected per source
        grain: filing/report/transaction
        identifiers: [chamber, filer_id, report_id, transaction_id]
        cadence: filing_schedule
        priority: 2
        notes: Retain source document URLs and filing amendments; do not infer precise values from disclosed ranges.
        person_join:
          state: blocked
          key: bioguide
          via: null
          blocked_by: [filer_identifier_bridge, reviewed_join_contract]
          notes: >-
            Disclosure portals identify filers by name and district, not by an
            id we hold. A bridge must come from an identifier source; matching
            display names is not allowed.
      - id: elections.results
        title: Election results and precinct/district crosswalks
        access: State authorities, MIT Election Lab, and VEST where licensing permits
        client: httpx; geopandas for geographic files
        grain: election × contest × geographic reporting unit
        identifiers: [election_id, contest_id, precinct_id, GEOID]
        cadence: per_election
        priority: 2
        person_join:
          state: blocked
          key: bioguide
          via: null
          blocked_by: [epic_7_not_started, candidate_identifier_bridge, reviewed_join_contract]
          notes: >-
            Candidate-to-member joins (elections-as-member) wait for Epic 7 and
            an identifier bridge such as FEC candidate ids. Results themselves
            (contest x unit) carry no person key and are not gated.
  - id: markets
    name: Market-data providers
    auth: provider_specific
    datasets:
      - id: markets.prices
        title: Securities master, prices, corporate actions, and fundamentals
        access: licensed provider API; convenience adapters for research
        client: OpenBB adapters; yfinance only as a non-canonical fallback
        grain: instrument × session/date
        identifiers: [instrument_id, ticker, exchange, trade_date]
        cadence: intraday_or_daily
        priority: 3
        notes: Ticker is not an identity. Use a licensed provider for production or redistribution.
      - id: markets.indices
        title: Major market index levels and constituents
        access: Licensed index provider or permitted OpenBB source adapter
        client: OpenBB Platform adapter
        grain: index × trade date; constituent × effective date
        identifiers: [index_id, instrument_id, trade_date]
        cadence: daily
        priority: 2
