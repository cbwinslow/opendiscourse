    direct: false
    rule: weighted_crosswalk
    gate: slice_proven
    status: planned
    verified: false
    connector: extend tiger_bulk
    notes: Only geography PUMS can be tied to; not part of the 119th/2024 first slice.
  - id: census.tiger.tract
    existing: census.tiger
    priority: P0
    stage: 8
    native: [tract]
    rule: atomic_aggregate
    gate: slice_proven
    status: planned
    verified: false
    connector: extend tiger_bulk
