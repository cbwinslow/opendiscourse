    direct: true
    rule: direct
    gate: v1_spine
    status: planned
    verified: false
    connector: extend tiger_bulk (LAYER_DIRS has state/county/cbsa/zcta only)
    notes: One boundary vintage per Congress; record vintage and Congress.
  - id: census.tiger.sldu
    existing: census.tiger
    priority: P0
    stage: 1
    native: [sldu]
    direct: true
    rule: direct
