version: 1
description: >-
  Executable backlog of datasets that describe the places members represent.
  One row per source family, in build order. This is a plan, not a loader: a row
  authorizes nothing until its `gate` is met and its Connector story is opened.
  `sources.yaml` stays the catalog of accepted/verified provider datasets;
  this file may also hold unverified candidate IDs. A candidate without
  `existing:` is promoted into `sources.yaml` only when its source story
  verifies the publisher contract. This file adds geography, priority, order,
  gate, and status. Spec:
  _bmad-output/specs/spec-district-linked-context/SPEC.md and
  jurisdiction-time-model.md beside it.
origin: >-
  Operator-supplied ChatGPT research, 2026-10-05, archived reasoning in the spec
  memlog. Every provider claim below (endpoint, years, geographies, cadence) is
  UNVERIFIED until the source's own story checks it at the publisher's endpoint
  (`verified: false`). Do not copy a claim into a Connector without that check.

first_vertical_slice:
  completion_story: "10.6"
  congress: 119
  boundary_vintage: 2024
  acs_5_release_year: 2024
  survey_window: [2020, 2024]
  mart: congressional_district_period
  rule: >-
    Finish this direct-geography slice before horizontal source expansion.
    It opens the slice_proven gate.

source_verification_required:
  - official publisher URL and product/dataset identifier
  - terms/licence or public-domain status
  - available years and known publisher gaps
  - cadence and revision/version behavior
  - native geography and stable join keys
  - field dictionary/schema
  - exact or bounded transfer-size estimate
  - publisher count, manifest, or documented best reconciliation basis
  - maintained reuse candidate evaluation before custom acquisition/parser code


# Field meanings
#   stage      build order (1 = first). Rows sharing a stage can proceed in parallel.
#   priority   P0 geographic infrastructure, P1 core outcome data, P2 contextual.
#   native     geography the publisher actually reports. `direct` = reports the
#              political geography itself (no crosswalk needed).
#   rule       how it reaches a member's division (selection hierarchy, spec
#              Constraints): direct | relationship | atomic_aggregate | weighted_crosswalk |
#              spatial_interpolation | zip_approx | member_attributed | context_only
#   gate       v1_spine            allowed now only when its Epic 10 story is ready.
#              slice_proven        opens only after Story 10.6 is complete and
#                                  recorded in PROJECT-STATE; do not expand horizontally.
#              epic7               elections, crime, money; Epic 7 not opened.
#              person_join         member-keyed; needs BioGuide via identitygate.
#   status     loaded | partial | downloaded | planned. `existing` names the
#              sources.yaml id when one exists.

geography_types:
  # core.geography.geography_type values to support (spec CAP-1 / model §2).
  # present today: nation, state, county, cbsa, zcta
  required_new: [congressional_district, sldu, sldl, tract, block_group, block, puma, vtd, place, school_district, aiannh, local_division]
  zip_policy: >-
    ZCTA is a Census statistical area, USPS ZIP is a delivery route. Neither is
    a district key. ZIP-only sources use zip_approx and are labelled.

selection_hierarchy:
  - direct observation at the exact political geography
  - exact aggregation from contained atomic geography (blocks, tracts)
  - weighted crosswalk (weight type matches the measure)
  - spatial interpolation
  - zip approximation

datasets:
  # ---- Stage 1: geography infrastructure (P0) ----
  - id: census.tiger.cd
